name: verify

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      SITE_BASE: ${{ vars.SITE_BASE || format('/{0}/', github.event.repository.name) }}
      VITE_AI_BASE_URL: ${{ vars.VITE_AI_BASE_URL }}
      VITE_RFQ_ENDPOINT: ${{ vars.VITE_RFQ_ENDPOINT }}
      VITE_ADMIN_PORTAL_URL: ${{ vars.VITE_ADMIN_PORTAL_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Environment
        run: node -v && npm -v

      - name: Type-check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: EDB library is up to date
        run: npm run edb:check

      - name: Production build
        run: npm run build

      # Pages publishes `main` → `/docs` (branch source), so the committed
      # folder *is* the site. Building here and diffing catches a source change
      # that forgot to ship the rebuilt folder — a stale `docs/` is how the live
      # site once went blank.
      - name: Committed docs/ matches this build
        run: |
          npm run site:check
          if [ -n "$(git status --porcelain docs)" ]; then
            echo "::error::docs/ is stale. Run 'npm run build' and commit the result."
            git status --short docs | head -30
            exit 1
          fi
