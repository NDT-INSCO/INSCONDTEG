name: AI endpoint check

# Answers one question with evidence instead of a guess: what does the deployed domain
# actually answer on each route — and does that deployment see the AI key?
# Results are published as annotations as well as logs, because log downloads from the
# runner can fail while annotations stay readable through the API.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the deployed domain
        run: |
          set -u
          base="https://inscondteg.vercel.app"

          probe() {
            path="$1"
            local pcode
            pcode=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 30 "$base$path" || echo 000)
            body=$(head -c 240 /tmp/body | tr -d '\n')
            echo "$path -> $pcode  $body"
            echo "::notice title=$path::$pcode $body"
          }

          # Wait for *this* commit to be the one serving production, not merely for the
          # endpoint to answer: an older deployment answers too, with older behaviour.
          sha="${GITHUB_SHA:0:7}"
          for attempt in $(seq 1 24); do
            live=$(curl -s --max-time 20 "$base/api/site/build-info" | sed -n 's/.*"commit":"\([a-f0-9]*\)".*/\1/p')
            echo "attempt $attempt -> serving ${live:-unknown} (want $sha)"
            [ "$live" = "$sha" ] && break
            sleep 20
          done
          echo "::notice title=deployment::serving ${live:-unknown}, expected $sha"
          if [ "$live" != "$sha" ]; then
            echo "::error title=Deployment drift::The production URL is not serving this main commit."
            exit 1
          fi

          # Check that the same release contains both integrations, without a password
          # or a billable draft. An empty body cannot create anything even if the gate fails.
          build_info=$(curl -fsS --max-time 20 "$base/api/site/build-info")
          manus_info=$(curl -fsS --max-time 20 "$base/api/ai/manus/status")
          factory_code=$(curl -sS -o /tmp/factory-gate.json -w '%{http_code}' --max-time 20 \
            -H "Origin: $base" -H 'Content-Type: application/json' -d '{}' "$base/api/admin/factory/draft")
          if ! jq -e --arg sha "$sha" '.commit == $sha and .hasAdminFactoryRoute == true' <<< "$build_info" > /dev/null \
            || ! jq -e '(.configured | type) == "boolean"' <<< "$manus_info" > /dev/null \
            || [ "$factory_code" != "401" ] \
            || ! jq -e '.error == "signed_out"' /tmp/factory-gate.json > /dev/null; then
            echo "::error title=Unified release::Expected Factory and Manus on the same commit with a signed-out Factory gate."
            exit 1
          fi
          echo "::notice title=Unified release::Factory + Manus present on $sha; signed-out draft rejected with 401."

          code=$(curl -s -o /tmp/status.json -w '%{http_code}' --max-time 30 "$base/api/ai/status" || echo 000)
          body=$(head -c 400 /tmp/status.json | tr -d '\n')
          echo "::notice title=/api/ai/status::$code $body"
          if [ "$code" != "200" ]; then
            echo "::error title=/api/ai/status::The AI gateway did not answer 200 on the production URL."
            exit 1
          fi
          # On a push, prove that the unified build and its protection reached production.
          # Model calls below (including any billable fallback) are manual only.
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then exit 0; fi

          probe /api/site/announcement
          probe /api/site/build-info
          probe /api/ai/does-not-exist

          echo '--- build-info body ---'
          curl -s --max-time 30 "$base/api/site/build-info" || true
          echo

          echo '--- a real model call: the copilot agent (proves the key reaches Gemini) ---'
          curl -s --max-time 70 -H 'Content-Type: application/json' \
            -d '{"message":"قل مرحباً في سطر واحد واذكر أنك مساعد إنسكو.","language":"ar"}' \
            "$base/api/ai/agent/user-copilot" -o /tmp/copilot.json || true
          head -c 400 /tmp/copilot.json | tr -d '\n'
          echo
          echo "::notice title=/api/ai/agent/user-copilot::$(head -c 300 /tmp/copilot.json | tr -d '\n')"

          echo '--- the tutor stream (declines when no course is reviewed) ---'
          curl -s -N --max-time 70 -H 'Content-Type: application/json' \
            -d '{"prompt":"اذكر في سطر واحد الفرق بين PAUT و TOFD.","language":"ar"}' \
            "$base/api/ai/tutor" -o /tmp/tutor.txt || true
          head -c 500 /tmp/tutor.txt | tr -d '\n'
          echo
          echo "::notice title=/api/ai/tutor::$(head -c 300 /tmp/tutor.txt | tr -d '\n')"

          # A stream that carries no text is a failure however the status code read.
          # The taxonomy comes from `/api/ai/status` `lastUpstream`, so a red probe
          # says which of quota / key / model it was, not just that something broke.
          deltas=$(grep -c '"type":"delta"' /tmp/tutor.txt || true)
          upstream=$(curl -s --max-time 20 "$base/api/ai/status" | sed -n 's/.*"lastUpstream":\([^}]*}\).*/\1/p')
          echo "tutor deltas: ${deltas}  lastUpstream: ${upstream:-none}"
          echo "::notice title=tutor answer::deltas=${deltas} lastUpstream=${upstream:-none}"
          if [ "${deltas:-0}" -eq 0 ]; then
            echo "::error title=/api/ai/tutor::the stream carried no answer text — lastUpstream says: ${upstream:-none}"
            exit 1
          fi
