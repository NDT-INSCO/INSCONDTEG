name: verify

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Environment
        run: node -v && npm -v

      - name: Type-check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: EDB library is up to date
        run: npm run edb:check

      - name: Production build
        run: npm run build

      # Pages publishes `main` → `/docs` (branch source), so the committed
      # folder *is* the site. Building here and diffing catches a source change
      # that forgot to ship the rebuilt folder — a stale `docs/` is how the live
      # site once went blank.
      - name: Committed docs/ matches this build
        run: |
          npm run site:check
          # Compares payloads, not file names: Vite's chunk hashes can be
          # assigned in a different order on another machine for the same
          # output, which used to fail a perfectly fresh docs/.
          npx tsx scripts/compare-docs-build.ts
