name: AI live check

# Asks the deployed domain the two questions a reader actually asks — the tutor and the
# copilot — and publishes the answers as annotations.
#
# `ai-probe.yml` only runs on `main` and refuses to report unless the deployment matches
# the commit it is testing. That is right for gating a merge, and useless when the
# question is "what does production answer *right now*". This runs from any branch.
#
# Annotations are the output channel on purpose: workflow logs cannot be downloaded from
# the runner (`gh run view --log` returns EOF), while annotations stay readable through
# the API.

on:
  workflow_dispatch:
    inputs:
      base:
        description: Deployment to test
        required: false
        default: https://inscondteg.vercel.app
  # Real questions can fall back to a billable Manus task. Keep them opt-in;
  # ai-probe.yml checks the production release without creating tasks on every push.

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.inputs.base || 'https://inscondteg.vercel.app' }}
    steps:
      - name: Ask the tutor
        run: |
          set -u
          curl -s -N --max-time 90 -H 'Content-Type: application/json' \
            -H 'Accept: text/event-stream' \
            -d '{"messages":[{"role":"user","content":"ما هو الفحص بالموجات فوق الصوتية PAUT وما الفرق بينه وبين TOFD؟"}],"language":"ar","stream":true}' \
            "$BASE/api/ai/tutor" > /tmp/tutor.sse || echo "curl exit $?"

          echo "deltas=$(grep -c '"type":"delta"' /tmp/tutor.sse || true)" >> "$GITHUB_ENV"
          first=$(sed -n 's/.*"type":"delta","text":"\(.\{0,160\}\).*/\1/p' /tmp/tutor.sse | head -1)
          echo "TUTOR_FIRST=$first" >> "$GITHUB_ENV"
          err=$(grep '"type":"error"' /tmp/tutor.sse | head -1 | cut -c1-200)
          echo "TUTOR_ERR=${err:-none}" >> "$GITHUB_ENV"
          meta=$(grep '"type":"meta"' /tmp/tutor.sse | head -1 | cut -c1-160)
          echo "TUTOR_META=${meta:-none}" >> "$GITHUB_ENV"

      - name: Ask the copilot
        run: |
          set -u
          code=$(curl -s -o /tmp/copilot.json -w '%{http_code}' --max-time 90 \
            -H 'Content-Type: application/json' \
            -d '{"message":"مرحبا","mode":"assistant","language":"ar"}' \
            "$BASE/api/ai/agent/user-copilot" || echo 000)
          echo "COPILOT_HTTP=$code" >> "$GITHUB_ENV"
          echo "COPILOT_BODY=$(head -c 200 /tmp/copilot.json)" >> "$GITHUB_ENV"

      - name: Probe each model
        run: |
          set -u
          for model in gemini-3.5-flash-lite gemini-3.8-flash gemini-3.6-flash gemini-4-hydrogen; do
            body=$(curl -s --max-time 30 "$BASE/api/ai/ping?api=interactions&model=$model&cachebust=$GITHUB_SHA")
            line=$(echo "$body" | tr -d '\n' | cut -c1-200)
            echo "::notice title=ping $model::$line"
          done
          echo "::notice title=build::$(curl -s --max-time 20 "$BASE/api/site/build-info?cachebust=$GITHUB_SHA" | tr -d '\n' | cut -c1-200)"
          echo "::notice title=status::$(curl -s --max-time 20 "$BASE/api/ai/status?cachebust=$GITHUB_SHA" | tr -d '\n' | cut -c1-260)"

      - name: Cross-origin access for the static build
        run: |
          set -u
          # The GitHub Pages build calls this gateway from another origin. Without the
          # preflight grant the request never leaves the browser, and the AI looks dead on
          # Pages while it works on Vercel.
          preflight=$(curl -s -D - -o /dev/null -X OPTIONS --max-time 20 \
            -H 'Origin: https://ndt-insco.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type, accept' \
            "$BASE/api/ai/tutor")
          echo "::notice title=cors preflight::$(printf '%s' "$preflight" | head -1 | tr -d '\r')"
          allow=$(printf '%s' "$preflight" | grep -i '^access-control-allow-origin' | tr -d '\r')
          echo "::notice title=cors allow-origin::${allow:-none}"
          vary=$(printf '%s' "$preflight" | grep -i '^vary' | tr -d '\r')
          echo "::notice title=cors vary::${vary:-none}"
          foreign=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS --max-time 20 \
            -H 'Origin: https://not-insco.example' \
            -H 'Access-Control-Request-Method: POST' \
            "$BASE/api/ai/tutor")
          echo "::notice title=cors foreign origin::http=$foreign"

      - name: Is the second engine connected?
        run: |
          set -u
          # Manus is the fallback when Gemini is rate-limited. Two facts are worth
          # publishing: whether a key is configured, and whether it authenticates — the
          # probe reads an id that cannot exist, so it costs no credits.
          status=$(curl -s --max-time 25 "$BASE/api/ai/manus/status?probe=1&cachebust=$GITHUB_SHA" | tr -d '\n')
          echo "::notice title=manus status::$(printf '%s' "$status" | cut -c1-260)"
          auth=$(printf '%s' "$status" | sed -n 's/.*"auth":"\([a-z_]*\)".*/\1/p')
          echo "::notice title=manus auth::${auth:-not-probed}"
          # The empty body is a 400: the route exists and validates before it spends
          # anything. A 404 here would mean the route never reached production.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST --max-time 20 \
            -H 'Content-Type: application/json' -d '{}' "$BASE/api/ai/manus")
          echo "::notice title=manus route::http=$code (400 = deployed and validating)"
          echo "::notice title=ai engines::$(curl -s --max-time 20 "$BASE/api/ai/status?cachebust=$GITHUB_SHA" | sed -n 's/.*\(\"manus\":{[^}]*}\).*/\1/p' | cut -c1-260)"

      - name: Publish what the reader would see
        run: |
          echo "::notice title=tutor deltas::${deltas:-0}"
          echo "::notice title=tutor meta::${TUTOR_META:-none}"
          echo "::notice title=tutor first delta::${TUTOR_FIRST:-none}"
          echo "::notice title=tutor error::${TUTOR_ERR:-none}"
          echo "::notice title=copilot::http=${COPILOT_HTTP:-?} body=${COPILOT_BODY:-none}"
