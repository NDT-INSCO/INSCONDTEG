name: account-privacy

on:
  push:
    branches: [main, 'arena/**']
    paths: ['.github/workflows/account-privacy.yml', 'firestore.rules', 'firebase*.json', 'tests/accountPrivacy.emulator.test.ts', 'tests/networkGroups.emulator.test.ts', 'src/account/**', 'src/client/communityGroupsService.ts', 'package*.json']
  pull_request:
    paths: ['.github/workflows/account-privacy.yml', 'firestore.rules', 'firebase*.json', 'tests/accountPrivacy.emulator.test.ts', 'tests/networkGroups.emulator.test.ts', 'src/account/**', 'src/client/communityGroupsService.ts', 'package*.json']

permissions:
  contents: read

jobs:
  firestore-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run lint:rules
      - name: Verify authorization with the Firestore emulator
        # The suite uses only a demo project and synthetic data. Keep the
        # authorization failure visible in the check even without log access.
        run: |
          log=$(mktemp)
          if npm run test:account-rules:emulator > "$log" 2>&1; then
            cat "$log"
          else
            cat "$log"
            python3 - "$log" <<'PYLOG'
          import re, sys
          with open(sys.argv[1], encoding='utf-8', errors='replace') as file:
              lines = [re.sub(r'\x1b\[[0-9;]*m', '', line.strip()) for line in file]

          # The emulator's gRPC noise matches every filter, and pushing it into the
          # last window buries the one line that names the failing test. Take the
          # failing test's own block instead: its "# Subtest:" name, the "not ok"
          # line that failed it, and the error/code lines that follow.
          fail_idx = [i for i, line in enumerate(lines) if re.match(r'not ok ', line)]
          if fail_idx:
              i = fail_idx[-1]
              block = [line for line in lines[i:i + 12]
                       if line and not re.search(r'GrpcConnection|@firebase/', line)]
              subtest = ''
              for j in range(max(0, i - 8), i):
                  if lines[j].startswith('# Subtest'):
                      subtest = lines[j]
                      break
              summary = '\n'.join([l for l in [subtest] + block if l])
          else:
              noise = [line for line in lines if re.search(r'not ok|exited|failed|error|Java', line, re.I)]
              summary = '\n'.join((noise or lines)[-25:])

          print('::error title=Firestore emulator verification::' + summary.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')[-3500:])
          PYLOG
            exit 1
          fi
